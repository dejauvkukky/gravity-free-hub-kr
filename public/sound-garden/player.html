<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Player</title>
    <link rel="stylesheet" href="../../assets/css/style.css?v=202512171655">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            /* Deep Dark */
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .player-header {
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        .title {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .video-box {
            flex-grow: 1;
            width: 100%;
            position: relative;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            padding: 10px;
            text-align: center;
            background: #1e293b;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="player-header">
        <div class="title" id="p-title">Loading...</div>
        <div class="desc" id="p-desc"></div>
    </div>
    <div class="video-box">
        <div id="player-container" style="width:100%; height:100%;"></div>
    </div>
    <div class="controls">
        <button id="pip-btn"
            style="background:#334155; color:white; border:none; padding:5px 15px; border-radius:15px; cursor:pointer; font-size:0.8rem; margin-bottom:5px; display:none;">내려놓기
            (PiP)</button>
        <div style="font-size:0.75rem; color:#64748b;">창을 닫으면 재생이 멈춥니다 🎵</div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const title = params.get('t') || 'Secret Player';
        const desc = params.get('d') || '';

        document.getElementById('p-title').textContent = title;
        document.getElementById('p-desc').textContent = desc;

        let player;
        function onYouTubeIframeAPIReady() {
            if (!videoId) {
                document.getElementById('player-container').innerHTML = '<div style="padding:20px; text-align:center;">비디오 정보가 없습니다.</div>';
                return;
            }

            player = new YT.Player('player-container', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'playsinline': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            setupMediaSession();
            setupPiP();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                navigator.mediaSession.playbackState = "playing";
            } else if (event.data === YT.PlayerState.PAUSED) {
                navigator.mediaSession.playbackState = "paused";
            }
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: desc,
                    album: 'Sound Garden',
                    artwork: [
                        { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => player.playVideo());
                navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
                navigator.mediaSession.setActionHandler('stop', () => player.stopVideo());
            }
        }

        async function setupPiP() {
            const pipBtn = document.getElementById('pip-btn');
            // Check if documentPictureInPicture is supported (experimental) or standard PiP
            const iframe = document.querySelector('iframe');

            // Note: Conventional PiP often doesn't work directly with YT iframes due to cross-origin
            // But we keep the UI ready or fallback to simple instructions.
            if (document.pictureInPictureEnabled) {
                // Typically works for <video> tags. For IFrames, it's limited.
                // pipBtn.style.display = 'inline-block';
            }
        }
    </script>
</body>

</html>
