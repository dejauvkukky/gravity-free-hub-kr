<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Garden - 시크릿 월드컵</title>
    <link rel="stylesheet" href="../../assets/css/style.css?v=202512171221">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .worldcup-container {
            max-width: 95%;
            margin: 0 auto;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .game-start {
            text-align: center;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-start.loaded {
            opacity: 1;
        }

        .worldcup-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 20px;
        }

        .start-btn {
            width: 100%;
            max-width: 300px;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, #20C997 100%);
            color: var(--color-secondary);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(126, 214, 193, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(126, 214, 193, 0.4);
        }

        /* VS Screen */
        .vs-screen {
            display: none;
        }

        .round-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .round-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .match-count {
            font-size: 1rem;
            color: #666;
        }

        .vs-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: stretch;
            margin-bottom: 30px;
            padding: 0 5%;
        }

        .choice-card {
            flex: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .choice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .choice-card:active {
            transform: translateY(-2px);
        }

        .choice-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .vs-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff6b6b;
            text-align: center;
            padding: 10px 0;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
        }

        .winner-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 24px;
            padding: 60px 30px;
            margin: 0 5% 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .trophy {
            font-size: 5rem;
            margin-bottom: 15px;
        }

        .winner-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
        }

        .family-stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .stats-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .replay-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .replay-btn.primary {
            background: var(--color-primary);
            color: var(--color-secondary);
        }

        .start-family-stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .start-stats-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #333;
            text-align: center;
        }

        .stat-item:last-child {
            border-bottom: none !important;
        }

        .replay-btn.secondary {
            background: #f1f5f9;
            color: #64748b;
        }

        .admin-btn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .admin-btn:hover {
            background: #d97706;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="../dashboard.html" class="logo">← Secret Garden</a>
            <span>시크릿 월드컵</span>
        </header>

        <div class="worldcup-container">
            <!-- Game Start Screen -->
            <div id="game-start" class="game-start">
                <h1 class="worldcup-title" id="worldcup-title">시크릿 월드컵</h1>
                <p style="color: #666; margin-bottom: 30px;">두 가지 중 하나를 선택하세요!</p>
                <button class="start-btn" onclick="startGame()">🎮 게임 시작</button>
                <button class="admin-btn" id="admin-btn" onclick="location.href='admin.html'">⚙️ 관리자 페이지</button>

                <!-- 가족 통계 -->
                <div class="start-family-stats" id="start-family-stats" style="display: none;">
                    <div class="start-stats-title">누가 뭘 골랐을까?</div>
                    <div id="start-stats-list">
                        <!-- 동적 생성 -->
                    </div>
                </div>
            </div>

            <!-- VS Screen -->
            <div id="vs-screen" class="vs-screen">
                <div class="round-info">
                    <div class="round-name" id="round-name">8강</div>
                    <div class="match-count" id="match-count">1 / 4</div>
                </div>

                <div class="vs-container">
                    <div class="choice-card" onclick="selectChoice(0)">
                        <div class="choice-name" id="choice-name-0">치킨</div>
                    </div>

                    <div class="vs-text">VS</div>

                    <div class="choice-card" onclick="selectChoice(1)">
                        <div class="choice-name" id="choice-name-1">피자</div>
                    </div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="result-screen">
                <div class="winner-card">
                    <div class="trophy">🏆</div>
                    <h2 style="margin-bottom: 10px; color: white;">최종 우승!</h2>
                    <div class="winner-name" id="winner-name">치킨</div>
                </div>

                <button class="replay-btn primary" onclick="startGame()">다시하기</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../src/worldcup.js?v=202512171221"></script>
</body>

</html>
