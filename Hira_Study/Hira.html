<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かな · 히라가나 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f5f0e7;--bg2:#ece4d6;--surface:#fffdf9;--surface2:#f4eee2;--ink:#24211c;--muted:#736a5c;--line:#e6ddcd;
  --accent:#d6492f;--accent-ink:#fff;--accent-soft:#f7ded7;--good:#2f8f5b;--good-soft:#e7f1ea;--bad:#d6492f;--bad-soft:#f8e6e2;
  --gold:#b98a2e;--shadow:0 8px 24px -12px rgba(90,70,40,.28);
}
[data-theme="dark"]{
  --bg:#14161b;--bg2:#0f1116;--surface:#1c2027;--surface2:#242a34;--ink:#ece7dd;--muted:#9a948a;--line:#2c333d;
  --accent:#e8573f;--accent-ink:#180c09;--accent-soft:#3a1f19;--good:#4caf7d;--good-soft:#17301f;--bad:#e8573f;--bad-soft:#331a16;
  --gold:#d9a441;--shadow:0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body,"Manrope",system-ui,sans-serif);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1200px 600px at 100% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 60%);
  min-height:100vh;font-family:'Manrope',system-ui,sans-serif}
::selection{background:var(--accent);color:var(--accent-ink)}
button{font-family:inherit}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:'Zen Maru Gothic',sans-serif;font-size:23px;font-weight:700}
.b-name{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1;display:block}
.b-sub{font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--muted)}
.top-progress{flex:1;display:flex;align-items:center;gap:10px;max-width:440px;margin-left:auto}
.tp-label{font-size:12px;color:var(--muted)}
.tp-track{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.tp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s ease}
.tp-txt{font-family:'Fraunces',serif;font-size:13px;font-weight:600;min-width:74px;text-align:right}
.top-actions{display:flex;gap:8px}
.icon{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px}
.icon:hover{border-color:var(--accent)}
@media(max-width:640px){.top-progress{display:none}}

/* app */
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:26px 20px 30px}
@keyframes viewin{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{display:flex;align-items:stretch;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.hero-l{flex:1;min-width:260px}
.h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px;letter-spacing:-.5px}
.h1 em{font-style:italic;color:var(--accent)}
.lead{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.7}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.stat-card{flex:0 0 288px;display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.ring{position:relative;width:120px;height:120px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring-track{stroke:var(--line)}
.ring-fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-family:'Fraunces',serif;font-size:24px}
.ring-txt span{font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--muted)}
.stat-rows{display:flex;flex-direction:column;gap:12px;font-family:'Noto Sans JP',sans-serif}
.stat-rows b{font-family:'Fraunces',serif;font-size:20px}
.stat-rows span{color:var(--muted);font-size:13px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;gap:10px}
.sec-head p{color:var(--muted);font-size:13px;font-family:'Noto Sans JP',sans-serif}
.h2{font-family:'Noto Sans JP',sans-serif;font-size:20px;margin:0}
.h3{font-family:'Noto Sans JP',sans-serif;font-size:16px;margin:0}
.mt{margin-top:26px}

.path{display:flex;flex-direction:column;gap:12px}
.phase-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
.phase-row:not(.locked):hover{transform:translateY(-2px);border-color:var(--accent)}
.phase-row.done{border-color:var(--good);background:var(--good-soft)}
.phase-row.locked{opacity:.55;cursor:not-allowed}
.pr-idx{font-family:'Fraunces',serif;font-weight:700;font-size:22px;width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--surface2);color:var(--muted)}
.phase-row.done .pr-idx{background:var(--good);color:#fff}
.pr-main{flex:1;min-width:0}
.pr-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:16px}
.pr-jp{font-size:18px}
.pr-rom{color:var(--muted);font-family:'Manrope',sans-serif;font-weight:600;font-size:13px}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--good);color:#fff;font-family:'Noto Sans JP',sans-serif}
.pr-chars{font-family:'Zen Maru Gothic',sans-serif;color:var(--muted);font-size:16px;margin:6px 0 9px;letter-spacing:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pr-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s ease}
.pr-side{flex:0 0 auto}
.go{font-family:'Noto Sans JP',sans-serif;color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.lock{font-size:16px}

/* phase head + chips */
.phase-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phase-head .chip{margin-top:6px}
.ph-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-jp{font-family:'Zen Maru Gothic',sans-serif;font-size:36px;font-weight:700}
.ph-rom{font-family:'Fraunces',serif;font-size:18px;color:var(--muted);font-weight:600}
.ph-desc{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:14px;margin-top:8px;line-height:1.6}
.chips-label{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:13px;margin-bottom:10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.kana-chip{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.kana-chip:hover{transform:translateY(-2px)}
.kana-chip .kc{font-family:'Zen Maru Gothic',sans-serif;font-size:46px;font-weight:700;line-height:1}
.kana-chip .kr{font-family:'Fraunces',serif;font-size:15px;color:var(--muted)}
.kana-chip .kn{font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--muted)}
.kana-chip.done .kc{color:var(--good)}
.kc-badge{position:absolute;top:8px;right:11px;color:var(--good);font-weight:800}
.word-chip{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.wc-w{font-family:'Zen Maru Gothic',sans-serif;font-size:27px;font-weight:700}
.wc-rom{font-family:'Fraunces',serif;color:var(--muted);font-size:14px}
.wc-mean{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:13px}

/* mode menu */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mode-card{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);flex-wrap:wrap}
.mc-icon{font-size:26px}
.mc-body{flex:1;min-width:120px}
.mc-body h3{font-family:'Noto Sans JP',sans-serif;font-size:17px;margin:0 0 3px}
.mc-body p{font-size:13px;color:var(--muted);margin:0 0 10px}
.mode-card .btn{margin-left:auto}
.mode-card .btn+ .btn{margin-left:0}

/* buttons/chips */
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);transition:transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* mode shell */
.mode-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mode-title{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:18px}
.mode-prog{font-family:'Fraunces',serif;font-weight:600;color:var(--muted)}
.prog-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.prog-fill{height:100%;background:var(--accent);transition:width .4s ease}
.q-label{text-align:center;color:var(--muted);font-size:15px;font-family:'Noto Sans JP',sans-serif;margin-bottom:4px}
.stage,.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 20px;min-height:210px;text-align:center}

.big{font-size:clamp(80px,26vw,150px);line-height:1;font-weight:700}
.big.kana{font-family:'Zen Maru Gothic',sans-serif}
.big:not(.kana){font-family:'Fraunces',serif;letter-spacing:-1px}
.rom-big{font-family:'Fraunces',serif;font-size:62px;font-weight:600}
.name-big{font-family:'Noto Sans JP',sans-serif;font-size:27px;color:var(--muted)}
.tip{font-size:15px;color:var(--muted);max-width:360px;font-family:'Noto Sans JP',sans-serif;line-height:1.5}
.face-cap{color:var(--muted);font-size:14px;margin-top:6px;font-family:'Noto Sans JP',sans-serif}

/* flip */
.flip{position:relative;max-width:520px;margin:6px auto 14px;perspective:1400px}
.flip-inner{position:relative;transition:transform .55s cubic-bezier(.2,.85,.25,1);transform-style:preserve-3d}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:220px;cursor:pointer}
.face.back{position:absolute;inset:0;transform:rotateY(180deg)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}

.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto;max-width:640px}
.ctrl{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
.ctrl.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.kbd-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px;font-family:'Noto Sans JP',sans-serif}

/* options */
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:14px auto 4px}
@media(min-width:640px){.opt-grid{grid-template-columns:repeat(4,1fr)}}
.opt{padding:18px 12px;font-size:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-family:'Manrope',sans-serif;color:var(--ink);transition:transform .1s,box-shadow .15s,border-color .15s}
.opt.kana{font-family:'Zen Maru Gothic',sans-serif;font-size:31px}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.opt.disabled{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* spell */
#spellForm{display:flex;gap:10px;max-width:440px;margin:10px auto 4px;align-items:center}
#spellInput{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:20px;background:var(--surface);color:var(--ink);font-family:'Manrope',sans-serif}
#spellInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spell-fb{min-height:24px;text-align:center;font-weight:700;margin-top:6px;font-family:'Noto Sans JP',sans-serif}
.spell-fb.ok{color:var(--good)} .spell-fb.bad{color:var(--bad)}
.speak-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.hint{color:var(--muted);font-size:14px;font-family:'Noto Sans JP',sans-serif}

/* listen */
.speak-big{width:98px;height:98px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:40px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.speak-big:hover{transform:scale(1.06)}

/* alternate */
.alt-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;max-width:520px;margin:10px auto 4px}
.alt-bar-fill{height:100%;width:0;background:var(--accent);border-radius:99px}

/* results */
.res{max-width:560px;margin:10px auto;text-align:center}
.res-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
.res-emoji{font-size:52px}
.res-score b{font-family:'Fraunces',serif;font-size:42px;display:block;line-height:1}
.res-score span{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:14px}
.res-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 20px}
.res-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.missed{text-align:left;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px}
.missed-item{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;display:flex;align-items:center;gap:10px}
.m-l{font-family:'Zen Maru Gothic',sans-serif;font-size:27px;font-weight:700}
.m-a{font-family:'Fraunces',serif;color:var(--muted);font-size:15px}
.m-m{font-family:'Noto Sans JP',sans-serif;color:var(--muted);font-size:13px}
.all-good{font-family:'Noto Sans JP',sans-serif;font-size:18px;color:var(--good);font-weight:700;margin:14px 0}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* toast + foot + ornament */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-family:'Noto Sans JP',sans-serif;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1040px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px;font-family:'Noto Sans JP',sans-serif;text-align:center}
.bg-ornament{position:fixed;right:-14px;top:0;bottom:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:0;opacity:.05}
.bg-ornament span{writing-mode:vertical-rl;font-family:'Zen Maru Gothic',sans-serif;font-size:130px;font-weight:700;color:var(--ink);letter-spacing:10px}
@media(max-width:900px){.bg-ornament{display:none}}
</style>
</head>
<body>
<div class="bg-ornament"><span>かな</span></div>
<header class="topbar">
  <div class="brand" data-act="home"><span class="seal">か</span><div><b class="b-name">Kana</b><span class="b-sub">히라가나 · 읽기 다지기</span></div></div>
  <div class="top-progress"><div class="tp-label">진행</div><div class="tp-track"><div id="topProgFill" class="tp-fill"></div></div><div id="topProgTxt" class="tp-txt"></div></div>
  <div class="top-actions">
    <button class="chip" id="soundChip" data-act="toggle-sound">🔊 소리 on</button>
    <button class="icon" id="darkBtn" data-act="toggle-dark" title="다크모드">🌙</button>
  </div>
</header>
<main id="app"></main>
<footer class="foot">진행 상황은 이 브라우저에 저장됩니다 · 인터넷 없이 로컬 사용 가능 · 발음은 브라우저 TTS</footer>

<script>
/* ================= DATA ================= */
const KANA=[
 {c:'あ',r:'a',n:'아',tip:'왼쪽에 대문자 “A”가 숨어 있음',row:'a'},
 {c:'い',r:'i',n:'이',tip:'눈(目)처럼 — “이”을 보다',row:'a'},
 {c:'う',r:'u',n:'우',tip:'우유(牛乳)의 “우”',row:'a'},
 {c:'え',r:'e',n:'에',tip:'계단(階段)을 “e”로 오르다',row:'a'},
 {c:'お',r:'o',n:'오',tip:'공손한 “お(o)” — “오”',row:'a'},
 {c:'か',r:'ka',n:'카',tip:'“k”를 칼로 베는 모양',row:'ka'},
 {c:'き',r:'ki',n:'키',tip:'손가락으로 “k”를 그리다',row:'ka'},
 {c:'く',r:'ku',n:'쿠',tip:'숨을 “쿠~” 하고 내쉬다',row:'ka'},
 {c:'け',r:'ke',n:'케',tip:'코로 “크~” 하고 웃음',row:'ka'},
 {c:'こ',r:'ko',n:'코',tip:'꼬리를 “코코” 흔든다',row:'ka'},
 {c:'さ',r:'sa',n:'사',tip:'산(山)의 “사”',row:'sa'},
 {c:'し',r:'shi',n:'시',tip:'신(新)의 “시” — shi',row:'sa'},
 {c:'す',r:'su',n:'수',tip:'그림(描く)을 “su”로 그리다',row:'sa'},
 {c:'せ',r:'se',n:'세',tip:'계단의 “se”',row:'sa'},
 {c:'そ',r:'so',n:'소',tip:'솥(鍋)의 “so”',row:'sa'},
 {c:'た',r:'ta',n:'타',tip:'“t”를 “다”로 — た',row:'ta'},
 {c:'ち',r:'chi',n:'치',tip:'친구의 “치” — chi',row:'ta'},
 {c:'つ',r:'tsu',n:'츠',tip:'쓰다(書く)의 “tsu” — 小文字',row:'ta'},
 {c:'て',r:'te',n:'테',tip:'테이블의 “te”',row:'ta'},
 {c:'と',r:'to',n:'토',tip:'토마토의 “to”',row:'ta'},
 {c:'な',r:'na',n:'나',tip:'“n”을 “나”로',row:'na'},
 {c:'に',r:'ni',n:'니',tip:'“二(2)”로 — ni',row:'na'},
 {c:'ぬ',r:'nu',n:'누',tip:'누운(臥す) “nu”',row:'na'},
 {c:'ね',r:'ne',n:'네',tip:'네(根) — ne',row:'na'},
 {c:'の',r:'no',n:'노',tip:'소유의 “の(no)”',row:'na'},
 {c:'は',r:'ha',n:'하',tip:'“h”을 “하”로 — は',row:'ha'},
 {c:'ひ',r:'hi',n:'히',tip:'“h”에 “i” — hi',row:'ha'},
 {c:'ふ',r:'fu',n:'후',tip:'바람(風)이 “푸~” 하고 — fu',row:'ha'},

/* ================= HELPERS ================= */
const el=s=>document.querySelector(s);
const KEY='kana-learner-v1';
const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
const AL={shi:['shi','si'],si:['shi','si'],tsu:['tsu','tu'],chi:['chi','ti'],ji:['ji','zi'],du:['du'],di:['di'],n:['n','nn']};
const accFor=r=>AL[r]||[r];
const findK=c=>KANA.find(k=>k.c===c);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function optionsChar(c){const row=(findK(c)||{}).row;let p=KANA.filter(k=>k.row===row&&k.c!==c).map(k=>k.c);
  if(p.length<3)p=p.concat(shuffle(KANA.filter(k=>k.c!==c&&!p.includes(k.c)).map(k=>k.c)).slice(0,3-p.length));
  return shuffle([c,...p.slice(0,3)]);}
function optionsRom(c){const k=findK(c);let p=KANA.filter(x=>x.row===k.row&&x.c!==c).map(x=>x.r);
  if(p.length<3)p=p.concat(shuffle(KANA.filter(x=>x.c!==c&&!p.includes(x.r)).map(x=>x.r)).slice(0,3-p.length));
  return shuffle([k.r,...p.slice(0,3)]);}
function optionsWord(r){return shuffle([r,...shuffle(WORDS.filter(w=>w.r!==r).map(w=>w.r)).slice(0,3)]);}

/* ================= STATE ================= */
let P={kana:{},words:{}};
let unlockAll=false;
const state={phase:null,mode:null,dark:false,sound:true};
let M={};

function save(){try{localStorage.setItem(KEY,JSON.stringify({progress:P,unlockAll,sound:state.sound,dark:state.dark}));}catch(e){} updateTop();}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){P=s.progress||{kana:{},words:{}};unlockAll=!!s.unlockAll;state.sound=s.sound!==false;state.dark=!!s.dark;}}catch(e){}}

function addResult(k,good){const s=(P.kana[k]||(P.kana[k]={a:0,ok:0}));s.a++;if(good)s.ok++;save();}
function addWordResult(w,good){const s=(P.words[w]||(P.words[w]={a:0,ok:0}));s.a++;if(good)s.ok++;save();}
function mastered(c){const s=P.kana&&P.kana[c];return s&&s.a>=3&&s.ok/s.a>=0.8;}
function wordPhaseDone(){const ok=WORDS.filter(w=>(P.words[w]||{ok:0}).ok>=1).length;return ok>=Math.ceil(WORDS.length*0.6);}
function phaseDone(p){return p.type==='words'?wordPhaseDone():p.chars.every(c=>mastered(c));}
function unlocked(i){if(unlockAll)return true;if(i===0)return true;return phaseDone(PHASES[i-1]);}
function curPhase(){return PHASES.find(x=>x.id===state.phase);}
function phaseChars(){return curPhase().chars;}

/* ================= TTS ================= */
let voices=[];
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices();}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){if(!voices.length)voices=speechSynthesis.getVoices()||[];return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'))||voices[0]||null;}
function speak(text,rate){if(!('speechSynthesis'in window)||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=rate||0.72;u.pitch=1;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function speakCurrent(){
  if(state.mode==='study')speak(M.deck[M.idx]);
  else if(state.mode==='words')speak(M.deck[M.idx].w);
  else if(state.mode==='alt')speak(M.deck[M.idx]);
  else if(M.cur)speak(M.cur.char||M.cur.word);
}

/* ================= QUESTION BUILDERS ================= */
function buildMatchQs(dir,chars){return shuffle(chars).map(ch=>{const k=findK(ch);
  if(dir==='k2r')return{char:ch,rom:k.r,label:ch,ans:k.r,prompt:ch,promptType:'char',correct:k.r,opts:optionsRom(ch)};
  return{char:ch,rom:k.r,label:ch,ans:k.r,prompt:k.r,promptType:'rom',correct:ch,opts:optionsChar(ch)};});}
function buildSpellQs(chars){return shuffle(chars).map(ch=>{const k=findK(ch);return{char:ch,rom:k.r,tip:k.tip,label:ch,ans:k.r,acc:accFor(k.r)};});}
function buildListenQs(chars){return shuffle(chars).map(ch=>{const k=findK(ch);return{char:ch,rom:k.r,label:ch,ans:k.r,correct:ch,opts:optionsChar(ch)};});}
function buildWordQuizQs(words){return shuffle(words).slice(0,12).map(w=>({word:w.w,rom:w.r,mean:w.mean,label:w.w,ans:w.r,correct:w.r,opts:optionsWord(w.r)}));}

/* ================= START MODES ================= */
function startStudy(){M={deck:shuffle(phaseChars()),idx:0,flipped:false};state.mode='study';renderDeck();}
function startWords(){M={deck:shuffle(WORDS),idx:0,flipped:false};state.mode='words';renderDeck();}
function startAlt(chars){M={deck:shuffle(chars||phaseChars()),idx:0,side:'kana'};state.mode='alt';renderDeck();}
function startMatch(dir,chars){M.dir=dir;M.set=buildMatchQs(dir,(chars||phaseChars()).slice());M.idx=0;M.results=[];M.answered=false;state.mode='match';renderCard();}
function startSpell(chars){M.set=buildSpellQs((chars||phaseChars()).slice());M.idx=0;M.results=[];M.answered=false;state.mode='spell';renderCard();}
function startListen(chars){M.set=buildListenQs((chars||phaseChars()).slice());M.idx=0;M.results=[];M.answered=false;state.mode='listen';renderCard();}
function startWordQuiz(words){M.set=buildWordQuizQs((words||WORDS).slice());M.idx=0;M.results=[];M.answered=false;state.mode='wordquiz';renderCard();}
function restartMode(){
  if(state.mode==='match')startMatch(M.dir||'k2r');
  else if(state.mode==='spell')startSpell();
  else if(state.mode==='listen')startListen();
  else if(state.mode==='wordquiz')startWordQuiz();
  else if(state.mode==='study')startStudy();
  else if(state.mode==='words')startWords();
  else if(state.mode==='alt')startAlt();
}
function retryMissed(){
  const missed=M.results.filter(r=>!r.good).map(r=>r.key);
  if(!missed.length)return;
  if(state.mode==='match')startMatch(M.dir||'k2r',missed);
  else if(state.mode==='spell')startSpell(missed);
  else if(state.mode==='listen')startListen(missed);
  else if(state.mode==='wordquiz')startWordQuiz(WORDS.filter(w=>missed.includes(w.w)));
}

/* ================= DECK OPS ================= */
function renderDeck(){if(state.mode==='study')renderStudy();else if(state.mode==='words')renderWordsDeck();else if(state.mode==='alt')renderAlt();}
function mAdvance(d){if(state.mode==='alt')stopAlt();M.idx=Math.max(0,Math.min(M.deck.length-1,M.idx+d));M.flipped=false;renderDeck();}
function mGot(){if(state.mode==='words')addWordResult(M.deck[M.idx].w,true);else addResult(M.deck[M.idx],true);if(state.mode==='alt')stopAlt();if(M.idx<M.deck.length-1){M.idx++;M.flipped=false;}renderDeck();}
function mAgain(){if(state.mode==='words')addWordResult(M.deck[M.idx].w,false);else addResult(M.deck[M.idx],false);const x=M.deck.splice(M.idx,1)[0];M.deck.push(x);if(state.mode==='alt')stopAlt();renderDeck();}
function mShuffle(){M.deck=shuffle(M.deck);M.idx=0;M.flipped=false;renderDeck();}

/* alternate timer */
let altTimeout=null;
function startAltTimer(){clearTimeout(altTimeout);const bar=el('#altBar');if(!bar)return;
  bar.style.transition='none';bar.style.width='0%';void bar.offsetWidth;bar.style.transition='width 3s linear';bar.style.width='100%';
  altTimeout=setTimeout(()=>{M.side=M.side==='kana'?'rom':'kana';renderAlt();},3000);}
function stopAlt(){clearTimeout(altTimeout);}

/* ================= TEST OPS ================= */
function answerOpt(val){if(M.answered)return;M.answered=true;const cur=M.cur;const good=val===cur.correct;
  if(cur.word)addWordResult(cur.word,good);else addResult(cur.char,good);
  markOpts(cur.correct,val);
  M.results.push({key:cur.word||cur.char,good,label:cur.label,ans:cur.ans,mean:cur.mean||''});
  setTimeout(testNext,820);}
function markOpts(correct,chosen){document.querySelectorAll('.opt').forEach(b=>{
  if(b.dataset.val===correct)b.classList.add('ok');
  if(chosen!==correct&&b.dataset.val===chosen)b.classList.add('bad');
  b.classList.add('disabled');});}
function spellAnswer(){if(M.answered)return;const inp=el('#spellInput');if(!inp)return;const val=norm(inp.value);if(!val)return;
  M.answered=true;const cur=M.cur;const good=cur.acc.some(x=>norm(x)===val);addResult(cur.char,good);
  const fb=el('#spellFb');if(fb){fb.textContent=good?'정답이에요!':'정답: '+cur.rom;fb.className='spell-fb '+(good?'ok':'bad');}
  const f=el('#spellForm');if(f)f.classList.add('locked');
  M.results.push({key:cur.char,good,label:cur.char,ans:cur.rom});
  setTimeout(testNext,1000);}
function testNext(){M.answered=false;if(M.idx<M.set.length-1){M.idx++;renderCard();}else showResults();}

/* ================= SHELL / CARDS ================= */
function progPct(){
  if(state.mode==='study'||state.mode==='words'||state.mode==='alt')return Math.round(M.idx/M.deck.length*100);
  return Math.round(M.idx/M.set.length*100);
}
function modeShell(title,prog){return `<div class="mode-top"><button class="chip" data-act="back-phase">← 페이즈</button><div class="mode-title">${title}</div><div class="mode-prog">${prog}</div></div><div class="prog-track"><div class="prog-fill" style="width:${progPct()}%"></div></div>`;}
function optGrid(opts,type){return `<div class="opt-grid">`+opts.map(v=>`<button class="opt ${type==='char'?'kana':''}" data-act="opt" data-val="${v}">${v}</button>`).join('')+`</div>`;}

function renderStudy(){const it=M.deck[M.idx];const k=findK(it);
  el('#app').innerHTML=modeShell('학습',`${M.idx+1}/${M.deck.length}`)+
   `<div class="flip ${M.flipped?'flipped':''}" data-act="m-flip"><div class="flip-inner">`+
     `<div class="face front"><div class="big kana">${it}</div><div class="face-cap">탭해서 뒤집기 · 소리 듣기</div></div>`+
     `<div class="face back"><div class="rom-big">${k.r}</div><div class="name-big">${k.n}</div><div class="tip">${k.tip}</div></div>`+
   `</div></div>`+
   `<div class="controls"><button class="chip" data-act="m-prev">←</button><button class="chip" data-act="m-speak">🔊 발음</button><button class="ctrl main" data-act="m-got">알았어요</button><button class="ctrl" data-act="m-again">다시 볼게요</button><button class="chip" data-act="m-next">다음 →</button></div>`+
   `<div class="kbd-hint">Space 뒤집기 · ←/→ 이동 · 1 알았어요 · 2 다시</div>`;
  animateIn();}
function renderWordsDeck(){const it=M.deck[M.idx];
  el('#app').innerHTML=modeShell('단어 학습',`${M.idx+1}/${M.deck.length}`)+
   `<div class="flip ${M.flipped?'flipped':''}" data-act="m-flip"><div class="flip-inner">`+
     `<div class="face front"><div class="big kana">${it.w}</div><div class="face-cap">탭해서 뒤집기</div></div>`+
     `<div class="face back"><div class="rom-big">${it.r}</div><div class="name-big">${it.mean}</div>${it.note?`<div class="tip">※ ${it.note}</div>`:''}</div>`+
   `</div></div>`+
   `<div class="controls"><button class="chip" data-act="m-prev">←</button><button class="chip" data-act="m-speak">🔊 발음</button><button class="ctrl main" data-act="m-got">알았어요</button><button class="ctrl" data-act="m-again">다시 볼게요</button><button class="chip" data-act="m-next">다음 →</button></div>`+
   `<div class="kbd-hint">Space 뒤집기 · 1 알았어요 · 2 다시</div>`;
  animateIn();}
function renderAlt(){const it=M.deck[M.idx];const k=findK(it);
  const show=M.side==='kana'?{big:it,cap:'이 글자는? · 발음 기억'}:{big:k.r,cap:'이 발음은? · '+k.n};
  el('#app').innerHTML=modeShell('교대 암기',`${M.idx+1}/${M.deck.length}`)+
   `<div class="alt-bar"><div id="altBar" class="alt-bar-fill"></div></div>`+
   `<div class="stage"><div class="big ${M.side==='kana'?'kana':''}">${show.big}</div><div class="face-cap">${show.cap}</div></div>`+
   `<div class="controls"><button class="chip" data-act="m-prev">←</button><button class="chip" data-act="m-speak">🔊 발음</button><button class="ctrl main" data-act="m-got">알았어요</button><button class="ctrl" data-act="m-again">다시 볼게요</button><button class="chip" data-act="m-next">다음 →</button></div>`+
   `<div class="kbd-hint">3초마다 글자 ↔ 발음 자동 교대 · 1 알았어요 · 2 다시</div>`;
  animateIn();startAltTimer();}
function renderCard(){const cur=M.cur=M.set[M.idx];const prog=`${M.idx+1}/${M.set.length}`;let inner='';
  if(state.mode==='match'){
    const label=cur.promptType==='char'?'이 글자의 발음(라틴 표기)을 고르세요':'이 발음에 해당하는 글자를 고르세요';
    inner=modeShell('맞추기',prog)+`<div class="q-label">${label}</div><div class="stage"><div class="big ${cur.promptType==='char'?'kana':''}">${cur.prompt}</div></div>`+optGrid(cur.opts,cur.promptType==='char'?'rom':'char');
  }else if(state.mode==='listen'){
    inner=modeShell('듣기',prog)+`<div class="q-label">소리를 듣고 같은 글자를 고르세요</div><div class="stage"><button class="speak-big" data-act="m-speak" aria-label="재생">🔊</button><div class="face-cap">다시 듣기</div></div>`+optGrid(cur.opts,'char');
  }else if(state.mode==='spell'){
    inner=modeShell('스펠링',prog)+`<div class="q-label">글자의 라틴 표기를 입력하세요</div>`+
     `<div class="stage"><div class="big kana">${cur.char}</div><div class="speak-row"><button class="chip" data-act="m-speak">🔊 발음 듣기</button><span class="hint">힌트 · ${cur.tip}</span></div></div>`+
     `<form id="spellForm"><input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: shi" /><button type="submit" class="btn main">확인</button></form><div id="spellFb" class="spell-fb"></div>`;
  }else if(state.mode==='wordquiz'){
    inner=modeShell('단어 퀴즈',prog)+`<div class="q-label">이 단어의 발음을 고르세요 · ${cur.mean}</div><div class="stage"><div class="big kana">${cur.word}</div></div>`+optGrid(cur.opts,'rom');
  }
  el('#app').innerHTML=inner;
  if(state.mode==='spell'){const i=el('#spellInput');if(i){i.focus();i.select&&i.select();}}
  if(state.mode==='listen')speak(cur.char);
  animateIn();}
function showResults(){const total=M.results.length;const ok=M.results.filter(r=>r.good).length;const pct=total?Math.round(ok/total*100):0;
  const missed=M.results.filter(r=>!r.good);
  const pi=PHASES.findIndex(p=>p.id===state.phase);const p=PHASES[pi];const pdone=phaseDone(p);const next=PHASES[pi+1];
  let mlist=missed.length
    ?`<div class="sec-head"><h3 class="h3">다시 볼 대상 (${missed.length})</h3></div><div class="missed">`+missed.map(r=>`<div class="missed-item"><span class="m-l">${r.label}</span><span class="m-a">${r.ans}</span>${r.mean?`<span class="m-m">${r.mean}</span>`:''}</div>`).join('')+`</div>`
    :`<div class="all-good">🎉 전부 정답이에요!</div>`;
  el('#app').innerHTML=`<div class="res">
    <div class="res-head"><div class="res-emoji">${pct===100?'🏆':pct>=70?'👍':'💪'}</div><div class="res-score"><b>${ok}/${total}</b><span>${pct}% 정확도</span></div></div>
    <div class="res-bar"><div class="res-fill" style="width:${pct}%"></div></div>
    ${mlist}
    <div class="res-actions">
      ${missed.length?`<button class="btn main" data-act="r-retry">오답 다시</button>`:''}
      <button class="btn" data-act="r-again">다시 시험</button>
      <button class="btn ghost" data-act="back-phase">페이즈로</button>
      ${pdone&&next?`<button class="btn main" data-act="r-next">다음 페이즈 →</button>`:''}
    </div></div>`;
  animateIn();}

/* ================= HOME / PHASE ================= */
function renderHome(){
  const done=KANA.filter(k=>mastered(k.c)).length;const total=KANA.length;const pct=Math.round(done/total*100);
  const wordsDone=WORDS.filter(w=>(P.words[w.w]||{ok:0}).ok>=1).length;
  let rows='';
  PHASES.forEach((p,i)=>{
    const isWords=p.type==='words';const un=unlocked(i);const pdone=phaseDone(p);
    let pbar=isWords?Math.round(wordsDone/WORDS.length*100):(p.chars.length?Math.round(p.chars.filter(c=>mastered(c)).length/p.chars.length*100):0);
    const preview=isWords?WORDS.slice(0,6).map(w=>w.w).join(' ')+' …':p.chars.map(c=>c).join(' ');
    rows+=`<div class="phase-row ${un?'':'locked'} ${pdone?'done':''}" ${un?`data-act="open-phase:${p.id}"`:`data-act="try-lock"`}>
      <div class="pr-idx">${i+1}</div>
      <div class="pr-main">
        <div class="pr-title"><span class="pr-jp">${p.jp}</span><span class="pr-rom">${p.t}</span>${pdone?'<span class="badge">완료</span>':''}</div>
        <div class="pr-chars">${preview}</div>
        <div class="pr-bar"><div class="pr-fill" style="width:${pbar}%"></div></div>
      </div>
      <div class="pr-side">${un?'<span class="go">시작 →</span>':'<span class="lock">🔒</span>'}</div>
    </div>`;});
  el('#app').innerHTML=`
    <section class="hero">
      <div class="hero-l">
        <h1 class="h1">히라가나, <em>소리</em>부터 다지기</h1>
        <p class="lead">읽기를 위해 <b>낱자 → 쉬운 단어</b> 순서로, 마스터한 만큼 다음 열이 열려요. 배운 글자에 따라 발음(🔊)을 직접 들어보세요.</p>
        <div class="hero-cta">
          <button class="btn main" data-act="continue">▶ 계속 학습</button>
          <button class="btn ghost" data-act="unlock-all">${unlockAll?'전체 열림 ✓':'모두 열기'}</button>
          <button class="btn ghost" data-act="reset">초기화</button>
        </div>
      </div>
      <div class="stat-card">
        <div class="ring">
          <svg viewBox="0 0 130 130"><circle class="ring-track" cx="65" cy="65" r="54"></circle><circle class="ring-fill" id="appRing" cx="65" cy="65" r="54"></circle></svg>
          <div class="ring-txt"><b id="appRingPct">${pct}%</b><span>마스터</span></div>
        </div>
        <div class="stat-rows"><div><b>${done}</b>/<span>${total}</span> 글자 마스터</div><div><b>${wordsDone}</b>/<span>${WORDS.length}</span> 단어 읽기</div></div>
      </div>
    </section>
    <div class="sec-head"><h2 class="h2">학습 경로</h2><p>왼쪽에서 순서대로 · 완료하면 다음 열림</p></div>
    <div class="path">${rows}</div>`;
  const c=2*Math.PI*54;const ring=el('#appRing');
  if(ring){ring.setAttribute('stroke-dasharray',c);ring.style.strokeDashoffset=c;requestAnimationFrame(()=>{ring.style.strokeDashoffset=c*(1-pct/100);});}
  updateTop();animateIn();
}
function renderPhase(id){
  const i=PHASES.findIndex(p=>p.id===id);const p=PHASES[i];const isWords=p.type==='words';
  let chips='',menu='';
  if(!isWords){
    chips=p.chars.map(c=>{const k=findK(c);const m=mastered(c);
      return `<div class="kana-chip ${m?'done':''}" data-act="chip-speak" data-char="${c}"><span class="kc">${c}</span><span class="kr">${k.r}</span><span class="kn">${k.n}</span>${m?'<span class="kc-badge">✓</span>':''}</div>`;}).join('');
    menu=`<div class="mode-grid">
      <div class="mode-card"><div class="mc-icon">📖</div><div class="mc-body"><h3>학습</h3><p>글자 · 발음 · 기억술 카드</p></div><button class="btn" data-act="mode-study">시작</button></div>
      <div class="mode-card"><div class="mc-icon">🔁</div><div class="mc-body"><h3>교대 암기</h3><p>글자↔발음 3초 자동 교대</p></div><button class="btn" data-act="mode-alt">시작</button></div>
      <div class="mode-card"><div class="mc-icon">🎯</div><div class="mc-body"><h3>맞추기</h3><p>4지선다 · 양방향</p></div><button class="btn main" data-act="match-k2r">글자→발음</button><button class="btn ghost" data-act="match-r2k">발음→글자</button></div>
      <div class="mode-card"><div class="mc-icon">✍️</div><div class="mc-body"><h3>스펠링</h3><p>라틴 표기 직접 입력</p></div><button class="btn" data-act="mode-spell">시작</button></div>
      <div class="mode-card"><div class="mc-icon">🗣️</div><div class="mc-body"><h3>듣기</h3><p>소리만 듣고 고르기</p></div><button class="btn" data-act="mode-listen">시작</button></div>
    </div>`;
  }else{
    chips=WORDS.map(w=>`<div class="word-chip"><span class="wc-w">${w.w}</span><span class="wc-rom">${w.r}</span><span class="wc-mean">${w.mean}</span></div>`).join('');
    menu=`<div class="mode-grid">
      <div class="mode-card"><div class="mc-icon">📚</div><div class="mc-body"><h3>단어 학습</h3><p>단어 · 발음 · 뜻 카드</p></div><button class="btn" data-act="mode-words">시작</button></div>
      <div class="mode-card"><div class="mc-icon">🏁</div><div class="mc-body"><h3>단어 퀴즈</h3><p>단어 → 발음 4지선다</p></div><button class="btn" data-act="mode-wordquiz">시작</button></div>
    </div>`;
  }
  el('#app').innerHTML=`
    <div class="phase-head"><button class="chip" data-act="back-home">← 홈</button>
      <div><div class="ph-title"><span class="ph-jp">${p.jp}</span><span class="ph-rom">${p.t}</span></div><div class="ph-desc">${p.desc} · ${p.tip}</div></div>
    </div>
    <div class="chips-label">${isWords?`단어 ${WORDS.length}개 (클릭할 필요 없음)`:`마스터 ${p.chars.filter(c=>mastered(c)).length}/${p.chars.length} · 글자를 누르면 발음 재생`}</div>
    <div class="chips">${chips}</div>
    <div class="sec-head mt"><h2 class="h2">연습 방법</h2></div>${menu}`;
  updateTop();animateIn();
}

/* ================= NAV ================= */
function goHome(){state.mode=null;state.phase=null;renderHome();}
function openPhase(id){if(!unlocked(PHASES.findIndex(p=>p.id===id)))return;state.phase=id;state.mode=null;renderPhase(id);}
function goContinue(){let idx=PHASES.findIndex((p,i)=>unlocked(i)&&!phaseDone(p));if(idx<0)idx=PHASES.length-1;openPhase(PHASES[idx].id);}
function updateTop(){const done=KANA.filter(k=>mastered(k.c)).length;const pct=Math.round(done/KANA.length*100);
  const f=el('#topProgFill');if(f)f.style.width=pct+'%';const t=el('#topProgTxt');if(t)t.textContent=`${done}/${KANA.length} · ${pct}%`;}
function animateIn(){const a=el('#app');if(!a)return;a.style.animation='none';void a.offsetWidth;a.style.animation='viewin .4s cubic-bezier(.2,.8,.2,1)';}
function applyTheme(){document.documentElement.setAttribute('data-theme',state.dark?'dark':'light');const b=el('#darkBtn');if(b)b.textContent=state.dark?'☀️':'🌙';}
function updateSoundChip(){const c=el('#soundChip');if(c)c.textContent=state.sound?'🔊 소리 on':'🔇 소리 off';}
function toast(msg){let t=el('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  switch(a){
    case 'home':goHome();break;
    case 'continue':goContinue();break;
    case 'unlock-all':unlockAll=true;save();renderHome();break;
    case 'reset':if(confirm('학습 기록을 모두 초기화할까요?')){P={kana:{},words:{}};unlockAll=false;save();renderHome();}break;
    case 'toggle-dark':state.dark=!state.dark;applyTheme();save();break;
    case 'toggle-sound':state.sound=!state.sound;updateSoundChip();save();break;
    case 'open-phase':openPhase(parseInt(a.split(':')[1],10));break;
    case 'try-lock':toast('🔒 이전 단계를 완료하면 열려요');break;
    case 'chip-speak':speak(t.dataset.char);break;
    case 'back-home':goHome();break;
    case 'back-phase':state.mode=null;renderPhase(state.phase);break;
    case 'mode-study':startStudy();break;
    case 'mode-alt':startAlt();break;
    case 'mode-words':startWords();break;
    case 'match-k2r':startMatch('k2r');break;
    case 'match-r2k':startMatch('r2k');break;
    case 'mode-spell':startSpell();break;
    case 'mode-listen':startListen();break;
    case 'mode-wordquiz':startWordQuiz();break;
    case 'm-prev':mAdvance(-1);break;
    case 'm-next':mAdvance(1);break;
    case 'm-flip':M.flipped=!M.flipped;renderDeck();break;
    case 'm-got':mGot();break;
    case 'm-again':mAgain();break;
    case 'm-shuffle':mShuffle();break;
    case 'm-speak':speakCurrent();break;
    case 'opt':answerOpt(t.dataset.val);break;
    case 'r-retry':retryMissed();break;
    case 'r-again':restartMode();break;
    case 'r-next':{const i=PHASES.findIndex(p=>p.id===state.phase);if(PHASES[i+1])openPhase(PHASES[i+1].id);}break;
  }
});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='spellForm'){e.preventDefault();spellAnswer();}});
document.addEventListener('keydown',e=>{
  const mode=state.mode;if(!mode)return;
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    if(mode==='spell'&&e.key==='Enter'){e.preventDefault();spellAnswer();}return;}
  if(mode==='study'||mode==='words'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(mode==='study'){M.flipped=!M.flipped;renderDeck();}}
    else if(e.key==='ArrowRight'){e.preventDefault();mAdvance(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();mAdvance(-1);}
    else if(e.key==='1'){mGot();}else if(e.key==='2'){mAgain();}
  }else if(mode==='alt'){
    if(e.key===' '||e.key==='1'){e.preventDefault();mGot();}
    else if(e.key==='2'){mAgain();}
    else if(e.key==='ArrowRight'){mAdvance(1);}else if(e.key==='ArrowLeft'){mAdvance(-1);}
  }else if(mode==='match'||mode==='listen'){
    if(['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click();}
    else if(e.key===' '&&mode==='listen'){e.preventDefault();speak(M.cur.char);}
  }else if(mode==='wordquiz'){
    if(['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click();}
  }
});

/* ================= INIT ================= */
function init(){load();applyTheme();updateSoundChip();goHome();}
init();
</script>
</body>
</html>
